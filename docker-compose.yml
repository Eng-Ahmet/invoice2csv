services:
  mongodb:
    image: mongo:7
    container_name: invoice2csv-db
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  python-vision:
    build:
      context: ./python-vision-service
      dockerfile: Dockerfile
    container_name: invoice2csv-python-vision
    ports:
      - "5840:5000"
    environment:
      - PORT=5000
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice2csv-backend
    ports:
      - "3840:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/invoice2csv
      - PYTHON_VISION_URL=http://python-vision:5000/extract-vision
    depends_on:
      - mongodb
      - python-vision
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice2csv-frontend
    ports:
      - "4840:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
