services:
  mongodb:
    image: mongo:7
    container_name: invoice2csv-db
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - default

  python-vision:
    build:
      context: ./python-vision-service
      dockerfile: Dockerfile
    container_name: invoice2csv-python-vision
    environment:
      - PORT=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice2csv-backend
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/invoice2csv
      - PYTHON_VISION_URL=http://python-vision:5000/extract-vision
    depends_on:
      - mongodb
      - python-vision
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - default
      - caddy_proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoice2csv-frontend
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true

volumes:
  mongo_data:


